<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="정종훈 - 게임 클라이언트 개발자 포트폴리오">
<title>정종훈 포트폴리오</title>
<style>
/* VOICE: 조용한 뷰어 — 슬라이드 자체가 주인공
   IDEA: 인쇄된 포트폴리오를 한 장씩 넘겨 보는 책상
   PICTURE: 슬라이드 12장
   COLOUR and TYPE: 슬라이드와 같은 흰 바탕 계열, 회색 배경
   LAYOUT: 세로로 쌓인 슬라이드, 휴대폰 폭에 맞춤 */
:root{color-scheme:light dark;--bg:light-dark(#e9e9e6,#1a1a1a);--ink:light-dark(#555,#aaa)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif;overflow-x:clip}
main{max-width:1200px;margin:0 auto;padding:clamp(8px,2vw,24px);display:flex;flex-direction:column;gap:clamp(8px,1.6vw,20px)}
img{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#fafaf8;box-shadow:0 1px 3px rgba(0,0,0,.12),0 6px 18px rgba(0,0,0,.08)}
</style></head><body>
<main>
<img src="p/p-01.jpg" alt="포트폴리오 1쪽">
<img src="p/p-02.jpg" alt="포트폴리오 2쪽" loading="lazy">
<img src="p/p-03.jpg" alt="포트폴리오 3쪽" loading="lazy">
<img src="p/p-04.jpg" alt="포트폴리오 4쪽" loading="lazy">
<img src="p/p-05.jpg" alt="포트폴리오 5쪽" loading="lazy">
<img src="p/p-06.jpg" alt="포트폴리오 6쪽" loading="lazy">
<img src="p/p-07.jpg" alt="포트폴리오 7쪽" loading="lazy">
<img src="p/p-08.jpg" alt="포트폴리오 8쪽" loading="lazy">
<img src="p/p-09.jpg" alt="포트폴리오 9쪽" loading="lazy">
<img src="p/p-10.jpg" alt="포트폴리오 10쪽" loading="lazy">
<img src="p/p-11.jpg" alt="포트폴리오 11쪽" loading="lazy">
<img src="p/p-12.jpg" alt="포트폴리오 12쪽" loading="lazy">
</main>
</body></html>
